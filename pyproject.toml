[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-docqa"
version = "0.1.0"
description = "Ask questions about your own documents: hybrid retrieval (BM25 + vectors), grounded answers, verified citations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
pdf = ["pypdf>=4"]
docx = ["python-docx>=1.1"]
local-embeddings = ["sentence-transformers>=2.7"]
dev = ["pytest>=7", "pypdf>=4", "python-docx>=1.1"]

[project.scripts]
rag-docqa = "rag_docqa.cli:main"

[tool.setuptools.packages.find]
include = ["rag_docqa*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
